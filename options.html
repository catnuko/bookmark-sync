<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark Sync</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafafa;
        color: #333;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei',
          sans-serif;
      }
      .placeholder {
        text-align: center;
        padding: 24px;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        background: #2563eb;
        color: #fff;
        font-size: 28px;
        font-weight: 700;
      }
      .name {
        font-size: 20px;
        font-weight: 600;
      }
      .note {
        margin-top: 10px;
        font-size: 13px;
        color: #888;
      }
    </style>
  </head>
  <body>
    <div class="placeholder">
      <div class="mark">B</div>
      <div class="name">Bookmark Sync</div>
      <p class="note">设置已整合进插件弹窗，点击浏览器工具栏图标即可使用。</p>
    </div>
    <script type="module">
      // 静态占位文案 + html lang 本地化（__MSG__ 占位符在 HTML 中不生效，需 JS 替换）
      document.documentElement.lang = chrome.i18n.getUILanguage();
      const note = document.querySelector('.note');
      const msg = chrome.i18n.getMessage('opts_note');
      if (note && msg) note.textContent = msg;
    </script>
  </body>
</html>
