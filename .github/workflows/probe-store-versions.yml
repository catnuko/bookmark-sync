name: Probe store versions

# 临时探针工作流（一次性，用完删除）：读取三家商店在架版本。
# 只读，不提交任何东西到商店。
# 存在的原因：本地没有 .env.submit，Chrome 的 fetchStatus 需要 service account 凭证，
# 而凭证只在 GitHub Environment `stores` 的 job 内注入。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: stores
    env:
      CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
      CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
      CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Collect store versions (dry-run, read-only)
        run: node scripts/fetch-store-versions.mjs --dry-run
