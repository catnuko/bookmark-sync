name: Automated Release

# 全自动发版：
#   1. 推送到 main 后，release-please 按「约定式提交」自动判断下一个版本号
#      （fix: → patch，feat: → minor，BREAKING CHANGE → major）
#   2. 自动更新 package.json 的 version、生成 CHANGELOG.md，并建一个 release PR 供你审阅合并
#   3. release PR 合并后，release-please 自动打 tag 并创建 GitHub Release
#   4. 本工作流随后构建两个 zip 并上传到该 Release：
#        - Chromium 包（Chrome/Edge 共用）
#        - Firefox 包
#    一次覆盖三个浏览器，Safari 不参与。
#
# 以后提交格式请使用 Conventional Commits，例如：
#   feat(ui): add export button      → 触发 minor（新功能）
#   fix(sync): resolve merge crash   → 触发 patch（修复）
#   BREAKING CHANGE                  → 触发 major（不兼容改动）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node

  build:
    needs: release-please
    # 仅当 release-please 真正创建了本次 Release 时才打包
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 注意：不用 pnpm build（会顺带做 Safari 的 Xcode 同步/编译），
      # 这里只跑 vite build + 手工跑 Firefox 脚本。
      - name: Build Chromium (Chrome/Edge)
        run: npx vite build

      - name: Build Firefox
        run: node scripts/build-firefox.mjs

      - name: Package zips
        run: |
          VER="${{ needs.release-please.outputs.version }}"
          mkdir -p dist
          (cd extension && zip -r "../dist/bookmark-sync-chromium-$VER.zip" .)
          (cd extension-firefox && zip -r "../dist/bookmark-sync-firefox-$VER.zip" .)
          echo "--- artifacts ---"
          ls -l dist/

      - name: Upload to GitHub Release
        run: |
          VER="${{ needs.release-please.outputs.version }}"
          gh release upload "v$VER" \
            "dist/bookmark-sync-chromium-$VER.zip" \
            "dist/bookmark-sync-firefox-$VER.zip" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}