name: Automated Release

# 全自动发版（dev → main 合并后全程自动，无需人工介入）：
#   1. 推送到 main 后，release-please 按「约定式提交」自动判断下一个版本号
#      （fix: → patch，feat: → minor，BREAKING CHANGE → major）
#   2. 自动更新 package.json / public/manifest.json / public/manifest.firefox.json
#      的版本并生成 CHANGELOG.md，建一个 release PR，随后本工作流自动合并它
#   3. release PR 合并后，release-please 自动打 tag 并创建 GitHub Release
#      （注意：GITHUB_TOKEN 的合并不会自动触发这一轮，需显式 workflow_dispatch 踢一脚，
#        见 Auto-merge 之后的 Dispatch 步骤）
#   4. 本工作流随后构建并上传到该 Release：
#        - Chromium 包（Chrome/Edge 共用）
#        - Firefox 包
#        - AMO 源码包（Firefox 上架审核要交源码，见 scripts/package-source.mjs）
#      一次覆盖三个浏览器，Safari 不参与。
#
#   5. 上传 GitHub Release 后，同步上传 Supabase Storage public bucket
#      `downloads`（官网下载页的分发源）+ latest.json（版本寻址）。
#      官网 DownloadView 运行时读 latest.json 生成下载链接，发新版官网无需重新部署。
#      仓库不再提交 zip 二进制（website/public/downloads 已 gitignore）。
#      源码包只挂 Release，不进 Supabase —— 官网访客不需要源码。
#
#   6. ★ 三家商店（Chrome / Edge / Firefox AMO）的提交**不在本工作流里**：
#      见 .github/workflows/publish-stores.yml —— 独立 workflow_dispatch 工作流，
#      人在 Actions 页面点一次「Run workflow」即放行，这是全流程唯一的人工动作。
#      为什么不挂在本工作流末尾：私有仓库 + Free 套餐不支持 environment 的
#      required reviewers / wait timer 保护规则（API 实测 422「billing plan
#      supports ... protection rule」），没法在流水线中途暂停等审批。
#      商店提交失败不影响本工作流已发布的一切（tag / Release / 官网下载）。
#
# 开发流程：所有改动走 dev 分支，用 Conventional Commits 提交，合并到 main 即自动发版。
# 提交格式示例：
#   feat(ui): add export button      → 触发 minor（新功能）
#   fix(sync): resolve merge crash   → 触发 patch（修复）
#   BREAKING CHANGE                  → 触发 major（不兼容改动）
#
# 发版卡住了怎么救（2026-09-29 补）：
#   - 「release PR 合了但没 tag」→ gh workflow run release.yml --ref main
#   - 「tag/Release 建好了但 zip 没传上去」（build 失败，且重跑整个工作流
#     救不回来——release 已存在，release-please 不会再报 release_created）→
#       gh workflow run release.yml --ref main -f tag=v2.5.1
#     resolve job 会按这个 tag 只跑 build：重新打包 + 覆盖上传
#     （GitHub Release 用 --clobber，Supabase 用 x-upsert），可反复执行。
#   - 「商店没提交成功」（凭证错/过期、审核系统抖动）→ 先修 stores environment 的
#     凭证，再跑 publish-stores.yml（Actions → Publish to stores → Run workflow），
#     只提交商店，不重跑打包、不重建 tag。

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: '补发：按已存在的 tag 只重跑打包上传（如 v2.5.1）；留空 = 正常发版流程'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  # 合并 release PR 后要自己 workflow_dispatch 踢一脚（见 Auto-merge 之后的步骤）
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    # 两次尝试的 outputs 用 `||` 取先成功的那个（失败/跳过的步骤 output 为空串，
    # 会自然落到下一次尝试）。注意 'false' 是非空串，在表达式里为真，所以
    # 「真的返回了 false」不会被误判成「这次没值」。
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.release_retry.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.release_retry.outputs.tag_name }}
      version: ${{ steps.release.outputs.version || steps.release_retry.outputs.version }}
    steps:
      - id: release
        continue-on-error: true
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node

      # release-please 偶发 GitHub GraphQL 5xx（2026-09-22 run 35690360641：
      # `release-please failed: Something went wrong while executing your query`），
      # 单次抖动就让整轮发版停摆。release-please 是幂等的（重跑只是更新已有
      # release PR），所以原地重试一次；两次都失败由末尾守卫步骤显式报错。
      - id: release_retry
        if: steps.release.outcome == 'failure'
        continue-on-error: true
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node

      # continue-on-error 会把失败吞成绿色，这里把「两次都失败」重新炸出来。
      - name: Fail if release-please failed twice
        if: steps.release.outcome == 'failure' && steps.release_retry.outcome == 'failure'
        run: |
          echo "::error::release-please 连续两次失败（多为 GitHub API 5xx 抖动）；重跑本工作流即可，或 gh workflow run release.yml --ref main"
          exit 1

      # gh 要在 git 仓库上下文里解析目标仓库；本 job 此前没有 checkout，
      # `gh pr merge` 会直接报 `failed to run git: fatal: not a git repository`
      # （v2.5.0 实测，run 36006530813），release PR 建了却合不掉。
      - name: Checkout
        uses: actions/checkout@v4

      # 全自动发版：release PR 无需人工合并，检测到即自动合并。
      # 注意：必须用 merge commit（--merge），release-please 靠 merge commit message 识别发布。
      # 注意（v4 输出语义，踩坑两次）：pr/prs 仅在「release 已创建」的轮次有值，
      # 创建 release PR 的轮次里是 unset；release_created（根组件）无 release 时也是
      # unset 而非 'false'。因此条件必须用 releases_created != 'true' + prs_created == 'true'。
      - name: Auto-merge release PR
        if: (steps.release.outputs.releases_created || steps.release_retry.outputs.releases_created) != 'true' && (steps.release.outputs.prs_created || steps.release_retry.outputs.prs_created) == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 显式指定仓库，双保险：即使 checkout 失效也不依赖本地 git 上下文
          GH_REPO: ${{ github.repository }}
          PRS_JSON: ${{ steps.release.outputs.prs || steps.release_retry.outputs.prs }}
        run: |
          echo "$PRS_JSON" | jq -c '.[]' | while read -r pr; do
            PR_NUMBER=$(echo "$pr" | jq -r '.number // empty')
            if [ -n "$PR_NUMBER" ]; then
              echo "Auto-merging release PR #$PR_NUMBER"
              gh pr merge --merge "$PR_NUMBER" --delete-branch=false
            fi
          done

      # ★ 合并动作本身**不会**触发第二轮：合并用的是 GITHUB_TOKEN，而 GitHub 规定
      # 「由 GITHUB_TOKEN 引发的事件不会再创建新的 workflow run」（防递归）。
      # 于是 release PR 合了、tag 却永远建不出来（2.5.1 实测：合并提交 ee3c4f8 的
      # `actions/runs?head_sha=...` 查询返回 total_count=0）。此前一直靠「人工合并」
      # （人的身份）绕开这条规则；a17dec4 把自动合并修好之后，反而断在这里。
      # workflow_dispatch 是这条规则的**例外**，所以合并完自己踢一脚。
      # 第二轮里 releases_created == 'true'，本步骤会被上面的 if 跳过，不会自激循环。
      - name: Dispatch next run to create tag/Release
        if: (steps.release.outputs.releases_created || steps.release_retry.outputs.releases_created) != 'true' && (steps.release.outputs.prs_created || steps.release_retry.outputs.prs_created) == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run release.yml --ref main

  # 统一决定「这次构建哪个 tag / 哪个版本」，让 build job 不再直接依赖
  # release-please 的「刚刚创建了 release」这一瞬时输出 —— 否则 tag 一旦存在，
  # build 就永远被跳过，打包/上传失败后再也补不回来（重跑整轮也没用）。
  resolve:
    needs: release-please
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      should_build: ${{ steps.resolve.outputs.should_build }}
    steps:
      - id: resolve
        env:
          # 手动补发时显式给的 tag 优先（正常发版的自动 dispatch 不带输入，为空）
          INPUT_TAG: ${{ inputs.tag }}
          CREATED_TAG: ${{ needs.release-please.outputs.tag_name }}
          CREATED_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            # ── 手动补发（-f tag=...）：按该 tag 重跑打包上传 ──────────────
            TAG="$INPUT_TAG"
            VER="${INPUT_TAG#v}"
          elif [ -n "$CREATED_TAG" ]; then
            # ── 自动路径（push / 自动 dispatch 的第二轮）─────────────────
            # 第一轮（建 release PR）CREATED_TAG 为空 → 不构建；
            # 第二轮（打 tag / 建 Release）才有值 → 构建。
            TAG="$CREATED_TAG"
            VER="$CREATED_VERSION"
          else
            # 没有可构建的 tag：保持 false（不构建）
            echo "没有可构建的 tag：既未给 inputs.tag，release-please 也未创建 Release"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "version=$VER"      >> "$GITHUB_OUTPUT"
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "本次构建目标：$TAG（版本 $VER）"

  build:
    needs: resolve
    # 正常发版（release-please 刚建了 release）和按 tag 补发，都会让 should_build=true
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 必须 22+：@supabase/realtime-js 要求原生 WebSocket（Node 20 无全局 WebSocket），
          # 质量门的单测在 import 阶段构造 supabase client 时会直接抛错。
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 发版前质量门：类型检查 + lint + 单测全过后才打包（防止坏代码进 Release）。
      - name: Quality gate
        run: pnpm typecheck && pnpm lint && pnpm test

      # 注意：release-please 的 extra-files(json) 在当前版本实测不生效
      # （v2.3.0 的 release PR 未更新 manifest，见 PR #13），这里按 package.json
      # 的版本号回填两个 manifest，保证发出去的 zip 版本号正确。
      - name: Sync extension manifest versions
        run: |
          VER=$(node -p "require('./package.json').version")
          node -e "
            const fs = require('fs');
            for (const p of ['public/manifest.json', 'public/manifest.firefox.json']) {
              const m = JSON.parse(fs.readFileSync(p, 'utf8'));
              m.version = process.env.VER;
              fs.writeFileSync(p, JSON.stringify(m, null, 2) + '\n');
              console.log(p, '->', m.version);
            }
          "
        env:
          VER: ${{ needs.resolve.outputs.version }}

      # 注意：不用 pnpm build（会顺带做 Safari 的 Xcode 同步/编译），
      # 这里只跑 vite build + 手工跑 Firefox 脚本。
      - name: Build Chromium (Chrome/Edge)
        run: npx vite build

      - name: Build Firefox
        run: node scripts/build-firefox.mjs

      - name: Package zips
        # 统一走 Node 脚本（与本地 `pnpm package` 同一条路径），不再依赖 runner 的 zip
        # 命令；版本显式传 resolve 定下的值，与 manifest 回填、上传文件名同源。
        run: |
          VER="${{ needs.resolve.outputs.version }}"
          node scripts/package-zips.mjs "$VER"
          node scripts/package-source.mjs "$VER"
          echo "--- artifacts ---"
          ls -l dist/

      - name: Upload to GitHub Release
        # 直接用 tag（而不是 "v$VER" 拼），补发时 tag 与 version 的前缀写法不一致也不会传错地方
        run: |
          VER="${{ needs.resolve.outputs.version }}"
          gh release upload "${{ needs.resolve.outputs.tag }}" \
            "dist/bookmark-sync-chromium-$VER.zip" \
            "dist/bookmark-sync-firefox-$VER.zip" \
            "dist/bookmark-sync-source-$VER.zip" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 官网分发层：public bucket，匿名可下载；x-upsert 支持同版本重传覆盖。
      # 顺序：先 zip 后 latest.json，避免 latest 指向尚不存在的文件。
      - name: Upload zips to Supabase Storage
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VER: ${{ needs.resolve.outputs.version }}
        run: |
          BASE="https://cwtqnsbpcetvqopdkcou.supabase.co/storage/v1/object/downloads"
          upload() {
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE/$1" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: $2" \
              -H "x-upsert: true" \
              --data-binary @"$3")
            echo "$1 -> HTTP $code"
            [ "$code" = "200" ] || { echo "::error::upload failed: $1 (HTTP $code)"; exit 1; }
          }
          upload "bookmark-sync-chromium-$VER.zip"  "application/zip"  "dist/bookmark-sync-chromium-$VER.zip"
          upload "bookmark-sync-firefox-$VER.zip"   "application/zip"  "dist/bookmark-sync-firefox-$VER.zip"
          printf '{"version":"%s"}\n' "$VER" > latest.json
          upload "latest.json" "application/json" "latest.json"
