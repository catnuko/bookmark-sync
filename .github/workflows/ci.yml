name: Quality Gate

# 质量门：只有推送到 main、以及任何 PR 才跑 typecheck + lint + 单测。
# dev 是自己的日常开发分支，提交不跑 CI（本地用 `pnpm check` 自检），
# 避免每次提交都刷一屏 workflow run。发版（release.yml）只负责构建与分发。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 必须 22+：@supabase/realtime-js 要求原生 WebSocket（Node 20 无全局 WebSocket），
          # 单测在 import 阶段构造 supabase client 时会直接抛错。与 publish-stores / store-versions 一致。
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm fmt:check

      - name: Unit tests
        run: pnpm test
